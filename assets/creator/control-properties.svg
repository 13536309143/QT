<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">控件类型不同，要修改的属性也不同（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">控件类型不同，要修改的属性也不同</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">QLineEdit</text><text x="50" y="244" class="line">objectName = nameEdit</text><text x="50" y="277" class="note">placeholderText 提</text><text x="50" y="303" class="note">示；text 才是输入</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">QSpinBox</text><text x="440" y="244" class="line">objectName = minutesSpin</text><text x="440" y="277" class="note">minimum=5 / maxim</text><text x="440" y="303" class="note">um=120 / value=30</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">QLabel</text><text x="830" y="244" class="line">objectName = resultLabel</text><text x="830" y="277" class="note">text=等待提交；wordWra</text><text x="830" y="303" class="note">p=true</text><text x="30" y="365" class="note">先看对象树中选中了谁，再看属性编辑器的类型与名称。</text></svg>