<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">一个动作只保留一条清楚的连接路径（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">一个动作只保留一条清楚的连接路径</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Designer 拖线</text><text x="50" y="244" class="line">控件已有信号 → 已有槽</text><text x="50" y="277" class="note">连接记录在 .ui 的 conne</text><text x="50" y="303" class="note">ctions</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">转到槽</text><text x="440" y="244" class="line">on_submitButton_clicked</text><text x="440" y="277" class="note">依赖 objectName 与元对</text><text x="440" y="303" class="note">象自动匹配</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">显式 connect</text><text x="830" y="244" class="line">clicked → submitPlan</text><text x="830" y="277" class="note">逻辑可搜索，不再重复自动连接</text><text x="30" y="365" class="note">同一提交动作若既自动连接又手动连接，可能点击一次执行两次。</text></svg>