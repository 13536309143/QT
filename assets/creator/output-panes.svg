<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">同一个失败，要去不同面板找证据（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">同一个失败，要去不同面板找证据</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Issues</text><text x="50" y="244" class="line">错误与警告摘要</text><text x="50" y="277" class="note">跳转第一条有意义的源码错误</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">Compile Output</text><text x="440" y="244" class="line">配置、编译、链接原始日志</text><text x="440" y="277" class="note">确认实际目标、编译器和 SDK</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">Application Output</text><text x="830" y="244" class="line">运行日志与退出信息</text><text x="830" y="277" class="note">检查缺失 DLL、插件、参数与业务</text><text x="830" y="303" class="note">错误</text><text x="30" y="365" class="note">截图或日志不能只截最后一行“失败”，要包含出错阶段与第一条原因。</text></svg>