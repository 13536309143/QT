<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">正确清空连接：先核对四个字段（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">正确清空连接：先核对四个字段</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">发送者 + 信号</text><text x="50" y="244" class="line">clearButton / clicked(bool)</text><text x="50" y="277" class="note">点按钮时发出通知</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">接收者 + 槽</text><text x="440" y="244" class="line">nameEdit / clear()</text><text x="440" y="277" class="note">clear 不需要接收 bool </text><text x="440" y="303" class="note">参数</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">保存 + 验证</text><text x="830" y="244" class="line">连接记录在 .ui</text><text x="830" y="277" class="note">预览可试清空，业务仍需真实运行</text><text x="30" y="365" class="note">截图中的 lineEdit → lineEdit 是选错发送者的反例，不能照着确认。</text></svg>