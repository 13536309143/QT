<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">运行设置必须核对三个独立值（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">运行设置必须核对三个独立值</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Executable / Target</text><text x="50" y="244" class="line">选对目标和配置</text><text x="50" y="277" class="note">01_hello 不是 cours</text><text x="50" y="303" class="note">e_tests</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">Arguments</text><text x="440" y="244" class="line">临时 --smoke 会自动退出</text><text x="440" y="277" class="note">练习后删掉，再验证窗口保持打开</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">Working directory</text><text x="830" y="244" class="line">普通相对路径从这里解析</text><text x="830" y="277" class="note">不改变 exe 本身所在位置</text><text x="30" y="365" class="note">不同 Kit 与 Debug/Release 的运行设置可能不同，切换后重新核对。</text></svg>