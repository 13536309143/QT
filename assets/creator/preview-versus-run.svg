<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">预览与真实运行：检查范围不同（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">预览与真实运行：检查范围不同</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Designer 预览</text><text x="50" y="244" class="line">检查控件外观与布局</text><text x="50" y="277" class="note">可观察部分保存在 .ui 的直接连</text><text x="50" y="303" class="note">接</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">保存并构建</text><text x="440" y="244" class="line">uic 处理 .ui</text><text x="440" y="277" class="note">自己的 .cpp 业务代码参与编译</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">真实运行</text><text x="830" y="244" class="line">验证输入与业务结果</text><text x="830" y="277" class="note">空输入、未确认、有效提交都要测试</text><text x="30" y="365" class="note">预览正常不证明 C++ 提交逻辑已经执行，也不代表数据库功能完成。</text></svg>