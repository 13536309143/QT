<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">逐过程、逐语句与跳出怎样选（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">逐过程、逐语句与跳出怎样选</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Step Over</text><text x="50" y="244" class="line">执行本行，不主动深入</text><text x="50" y="277" class="note">先看自己的业务状态变化</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">Step Into</text><text x="440" y="244" class="line">尝试进入当前调用</text><text x="440" y="277" class="note">适合自己写的函数，需匹配源码符号</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">Step Out / Continue</text><text x="830" y="244" class="line">离开当前函数 / 继续运行</text><text x="830" y="277" class="note">不是停止调试或关闭程序</text><text x="30" y="365" class="note">先选择 Debug 构建；暂停 GUI 线程时窗口暂时不响应是预期现象。</text></svg>