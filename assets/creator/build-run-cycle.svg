<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">保存、构建、运行是三个不同动作（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">保存、构建、运行是三个不同动作</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">保存源码</text><text x="50" y="244" class="line">main.cpp / form.ui</text><text x="50" y="277" class="note">确认没有未保存标记</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">构建目标</text><text x="440" y="244" class="line">01_hello + Debug</text><text x="440" y="277" class="note">编译输出成功才产生新的 exe</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">运行目标</text><text x="830" y="244" class="line">运行配置中的 exe</text><text x="830" y="277" class="note">看新标题，证明运行的是新构建</text><text x="30" y="365" class="note">编辑器能打开文件、编译成功和窗口出现，各自证明的事不同。</text></svg>