<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">Tab 顺序与伙伴关系解决不同问题（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">Tab 顺序与伙伴关系解决不同问题</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Tab 顺序</text><text x="50" y="244" class="line">姓名 → 分钟 → 确认</text><text x="50" y="277" class="note">再到生成和清空按钮</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">Buddy</text><text x="440" y="244" class="line">姓名(&amp;N) → nameEdit</text><text x="440" y="277" class="note">Alt+N 将焦点交给姓名框</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">运行验收</text><text x="830" y="244" class="line">Tab / Shift+Tab / Alt+N</text><text x="830" y="277" class="note">用真实键盘操作，不只看设计编号</text><text x="30" y="365" class="note">切回普通编辑模式后再移动控件，避免鼠标仍在改 Tab 或伙伴关系。</text></svg>