<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">Kit 是一组相互兼容的工具（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">Kit 是一组相互兼容的工具</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">Qt SDK</text><text x="50" y="244" class="line">Qt 6.8.3 / msvc2022_64</text><text x="50" y="277" class="note">用课程 SDK 的 qmake.e</text><text x="50" y="303" class="note">xe 识别版本</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">编译器</text><text x="440" y="244" class="line">MSVC 2022 x64</text><text x="440" y="277" class="note">不能混用 MinGW 的 GCC</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">调试器</text><text x="830" y="244" class="line">CDB x64</text><text x="830" y="277" class="note">构建成功后仍需单独检查调试能力</text><text x="30" y="365" class="note">检查版本、架构与调试器，不按名字相近就随便组合。</text></svg>