<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title"><title id="title">本课向导中应填写的值（教学示意，非截图）</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#173e50}.title{font-size:28px;font-weight:bold}.label{font-size:24px;font-weight:bold}.line{font-size:21px}.note{font-size:19px}.pill{font-size:16px;fill:#547584}</style><rect width="1200" height="440" rx="12" fill="#f5f9fb"/><text x="30" y="44" class="title">本课向导中应填写的值</text><text x="30" y="76" class="pill">教学关系示意 · 不代表 Creator 的实际停靠布局或按钮坐标</text><rect x="30" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="62" cy="146" r="17" fill="#d8eee8"/><text x="56" y="153" class="line">1</text><text x="50" y="198" class="label">工程位置</text><text x="50" y="244" class="line">CreatorProfile</text><text x="50" y="277" class="note">创建在 E:\QT\practic</text><text x="50" y="303" class="note">e 下</text><rect x="420" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="452" cy="146" r="17" fill="#d8eee8"/><text x="446" y="153" class="line">2</text><text x="440" y="198" class="label">类与基类</text><text x="440" y="244" class="line">ProfileWidget / QWidget</text><text x="440" y="277" class="note">不是默认 MainWindow /</text><text x="440" y="303" class="note"> QMainWindow</text><rect x="810" y="112" width="360" height="205" rx="12" fill="white" stroke="#b7d2df" stroke-width="2"/><circle cx="842" cy="146" r="17" fill="#d8eee8"/><text x="836" y="153" class="line">3</text><text x="830" y="198" class="label">生成表单</text><text x="830" y="244" class="line">勾选 Generate form</text><text x="830" y="277" class="note">源文件与 profilewidge</text><text x="830" y="303" class="note">t.ui 一起保留</text><text x="30" y="365" class="note">示意是课程目标值；真实截图保留向导默认值，阅读时对照修改。</text></svg>