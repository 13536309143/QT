<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title"><title id="title">个人学习计划表单的布局树示意</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#163b4c;font-size:22px}.small{font-size:18px}.heading{font-size:28px;font-weight:bold}.box{fill:#edf5f8;stroke:#aac7d4;stroke-width:2}.green{fill:#e3f3ee;stroke:#6bad98;stroke-width:2}</style><rect width="1100" height="650" fill="white"/><text x="30" y="45" class="heading">从局部布局到整体布局：先分组，再嵌套</text><rect x="30" y="90" width="1040" height="70" rx="10" class="green"/><text x="50" y="130">ProfileWidget：顶层 QWidget + 垂直布局</text><path d="M60 160 V225 H110" fill="none" stroke="#6b8c9c" stroke-width="3"/><rect x="110" y="190" width="920" height="75" rx="10" class="box"/><text x="130" y="230">表单布局</text><text x="430" y="232" class="small">姓名标签 + nameEdit；分钟标签 + minutesSpin</text><path d="M60 160 V335 H110" fill="none" stroke="#6b8c9c" stroke-width="3"/><rect x="110" y="300" width="920" height="75" rx="10" class="box"/><text x="130" y="340">agreeCheck</text><text x="430" y="342" class="small">确认学习计划</text><path d="M60 160 V435 H110" fill="none" stroke="#6b8c9c" stroke-width="3"/><rect x="110" y="400" width="920" height="75" rx="10" class="box"/><text x="130" y="440">水平按钮布局</text><text x="430" y="442" class="small">submitButton + clearButton + 水平 Spacer</text><path d="M60 160 V545 H110" fill="none" stroke="#6b8c9c" stroke-width="3"/><rect x="110" y="510" width="920" height="75" rx="10" class="box"/><text x="130" y="550">结果与底部空间</text><text x="430" y="552" class="small">resultLabel（换行）+ 垂直 Spacer</text><text x="30" y="630" class="small">示意图：对象树用来确认层级；不是拖拽时必须固定使用的坐标。</text></svg>