<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="title"><title id="title">Qt Creator 工作区功能分区示意，非截图</title><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#163b4c;font-size:22px}.small{font-size:18px}.heading{font-size:28px;font-weight:bold}.box{fill:#edf5f8;stroke:#aac7d4;stroke-width:2}.green{fill:#e3f3ee;stroke:#6bad98;stroke-width:2}</style><rect width="1100" height="650" fill="white"/><text x="30" y="45" class="heading">Qt Creator 工作区：先看当前任务，再找面板</text><rect x="30" y="80" width="1040" height="65" rx="10" class="box"/><text x="50" y="120">菜单：文件 / 编辑 / 构建 / 调试 / 工具 / 帮助</text><rect x="30" y="165" width="150" height="370" rx="10" class="box"/><text x="50" y="205">模式切换</text><text x="50" y="245">编辑</text><text x="50" y="295">设计</text><text x="50" y="345">调试</text><text x="50" y="395">项目</text><rect x="200" y="165" width="220" height="370" rx="10" class="box"/><text x="220" y="205">项目树</text><text x="220" y="245" class="small">CMakeLists.txt</text><text x="220" y="285" class="small">.cpp / .h / .ui</text><text x="220" y="340" class="small">核对正在改的文件</text><rect x="440" y="165" width="630" height="250" rx="10" class="green"/><text x="460" y="205">中央：源码编辑 / 表单设计</text><text x="460" y="250">.cpp → 业务逻辑</text><text x="460" y="295">.ui → 控件、属性、布局</text><text x="460" y="345" class="small">Designer 中另有控件箱、对象树和属性面板</text><rect x="440" y="435" width="630" height="100" rx="10" class="box"/><text x="460" y="475">底部：问题 / 编译输出 / 应用输出</text><text x="30" y="585">运行前确认：Kit → Debug/Release → 运行目标 → 参数与环境</text><text x="30" y="625" class="small">功能分区示意，非本机截图；实际面板可移动，菜单随语言和版本变化。</text></svg>